<!DOCTYPE html>
<html lang="id">
<head>

<title>Konfirmasi Kehadiran — HUT ke-80 Arhanud</title>
<!--
  HALAMAN KONFIRMASI TAMU (satu sumber, tiga host):
   - review lokal (server review)   : RPC_URL=""
   - domain undangan.arhanud80.online : RPC_URL=<Apps Script exec>
   - tertanam di Kode.gs            : pakai google.script.run native
  Tidak pernah lagi bergantung pada navigasi script.google.com

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff;overflow-x:hidden}
  .page{width:100%;min-height:100dvh;padding:clamp(5px,1.2vw,10px);position:relative;overflow:hidden;

  .page:before{content:"";position:absolute;inset:clamp(4px,1vw,7px);border:2px solid #d8aa2b;
        border-radius:clamp(16px,4vw,24px);pointer-events:none}
  .content{position:relative;z-index:2;width:100%;min-height:100dvh;display:flex;flex-direction:column;
        justify-content:center;align-items:center;padding:clamp(12px,2.5vmin,28px) clamp(10px,3vw,28px) clamp(20px,4vmin,36px)}
  .logo-area{width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .logo{width:clamp(84px,12vmin,130px);height:clamp(84px,12vmin,130px);object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));display:block}
  .welcome{width:100%;text-align:center;margin-bottom:4px}
  .welcome-small{color:#d8aa2b;font-size:clamp(12px,3.6vw,16px);font-weight:800;letter-spacing:clamp(1px,.4vw,2px)}
  .welcome-big{color:#f2c63d;font-size:clamp(22px,6.8vw,34px);font-weight:900;letter-spacing:.5px;line-height:1}
  .card{width:min(96vw,720px);border:1px solid #d8aa2b;border-radius:16px;padding:clamp(14px,2.5dvh,22px) clamp(14px,4vw,24px);

  .b2{display:inline-block;width:auto;min-height:0;margin:0;padding:10px 14px;font-size:13px;font-weight:800;

    .card{width:min(94vw,780px);padding:28px 36px}

<script>
/* ====== PUSTAKA QR (lokal — tanpa layanan luar) ====== */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

  var p = document.querySelector('input[name=kehadiran]:checked');
  var box = document.getElementById("jumlahBox");
  if(p && p.value === "TIDAK HADIR"){ box.style.display = "none"; }
  else { box.style.display = "block"; }
}

function buatQrSvg(tok){
  try{
    var qr = qrcode(0, "M");
    qr.addData(String(tok)); qr.make();
    return '<div class="qrbox">' + qr.createSvgTag(6, 2) + '</div>';
  }catch(e){
    return '<div class="qrbox" style="background:#fff;color:#000;font-weight:900;padding:22px;word-break:break-all">'
         + String(tok).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})
         + '</div>';
  }
}

function showQr(tok, judul, catatan){
  var p = document.getElementById("pesan");
  p.innerHTML = '<div style="font-size:30px;margin-bottom:2px">✓</div>'
    + '<strong>' + judul + '</strong><br><br>'
    + buatQrSvg(tok)
    + '<div class="small">' + catatan + '</div>';
  p.style.display = "block";
}

function tampilkanError(msg){
  var p = document.getElementById("pesan");
  p.innerHTML = '<strong>⚠ PERHATIAN</strong><br><br><span class="small">' + msg + '</span>';
  p.style.display = "block";
  p.classList.add("errbox");
}

function isiFormDariLink(){
  var el = document.getElementById("nama");
  if(pNama && el && !el.value) el.value = pNama;
  var el2 = document.getElementById("jumlah");
  if(pJumlah && el2 && (el2.value === "1" || !el2.value)) el2.value = pJumlah;
}

if(QR){
  document.title = "Kartu QR — HUT ke-80 Arhanud";
  showQr(QR, "KARTU QR KEHADIRAN",
    "Tunjukkan kode QR ini saat tiba di lokasi.<br>Screenshot / simpan gambar ini.");
} else if(!TOK){
  tampilkanError("Link undangan tidak lengkap. Silakan minta link baru kepada panitia.<br><br>HUT ke-80 Arhanud — Terima kasih.");
} else {
  isiFormDariLink();
  document.getElementById("formKonfirmasi").style.display = "block";
}

document.getElementById("formKonfirmasi").addEventListener("submit", function(e){
  e.preventDefault();
  var p = document.querySelector('input[name=kehadiran]:checked');
  if(!p){ alert("Silakan pilih konfirmasi kehadiran."); return; }
  var nama = document.getElementById("nama").value.trim();
  if(!nama){ alert("Nama tamu wajib diisi."); return; }
  var jumlah = 1;
  if(p.value === "HADIR"){
    jumlah = Number(document.getElementById("jumlah").value || 0);
    if(jumlah < 1){ alert("Jumlah hadir minimal 1 orang."); return; }
    if(jumlah > 20){ alert("Jumlah hadir maksimal 20 orang."); return; }
  } else { jumlah = 0; }

  var btn = document.getElementById("btnKirim");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>MENGIRIM KONFIRMASI...';

  var data = {
    nama: nama,
    kehadiran: p.value,
    jumlah: jumlah,
    keterangan: document.getElementById("keterangan").value.trim(),
    tok: TOK
  };

  tampilkanSukses(data);

  // 1) BEACON (fire-and-forget) — kirim SEKARANG, tidak menunggu apa pun.
  //    Dedupe di server mencegah WA ganda bila jalur lain juga berhasil.
  kirimBeacon(data);

  // 2) RPC (fetch dulu, fallback JSONP) — hanya untuk memperbarui teks status.
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.ok){
        perbaruiStatus(data, "Konfirmasi dikirim. Jika kartu QR belum sampai dalam 2 menit, klik tombol di bawah.");
        return;
      }
      if(res.already){
        perbaruiStatus(data, "Konfirmasi sudah tersimpan sebelumnya. Kartu QR sudah dikirim ke WA Anda.");
      } else if(res.wa === "sent"){
        perbaruiStatus(data, "<strong>Konfirmasi tersimpan — kartu QR telah dikirim ke WhatsApp Anda.</strong>");
      } else {
        perbaruiStatus(data, "Konfirmasi tersimpan. Jika QR belum terkirim dalam 2 menit, klik tombol di bawah.");
      }
    })
    .withFailureHandler(function(){
      perbaruiStatus(data, "Konfirmasi dikirim. Jika kartu QR belum sampai dalam 2 menit, klik tombol di bawah.");
    })
    .simpanKonfirmasi(data);

  // 3) Auto-cek status 2x (tanpa mengganggu) — memperbarui teks bila QR sudah terkirim.
  cekStatusDelayed(30000);
  cekStatusDelayed(90000);
});

// Tampilkan QR + status seketika (tanpa menunggu server)
function tampilkanSukses(data){
  document.getElementById("formKonfirmasi").style.display = "none";
  document.getElementById("aksiUlang").style.display = "flex";
  showQr(data.tok, "KONFIRMASI DIKIRIM",
    "<span id='stProses'>Menyimpan & mengirim kartu QR ke WhatsApp Anda…</span>");
}

function perbaruiStatus(data, teks){
  var el = document.getElementById("stProses");
  if(el){ el.innerHTML = "<strong>✔ " + teks + "</strong><br><br>Simpan / screenshot QR di bawah sebagai kartu kehadiran Anda."; }
}

// Kirim konfirmasi lewat <img> (fire-and-forget) — tidak menunggu respons,
// bekerja di semua jaringan & browser. Dedupe server mencegah WA ganda.
function kirimBeacon(d){
  try{
    var u = WEBAPP + "?mode=konfirmasi&t=" + encodeURIComponent(d.tok)
      + "&nama=" + encodeURIComponent(d.nama)
      + "&kehadiran=" + encodeURIComponent(d.kehadiran)
      + "&jumlah=" + encodeURIComponent(d.jumlah)
      + "&ket=" + encodeURIComponent(d.keterangan);
    var im = new Image(); im.src = u;
  }catch(err){}
}
function cekStatusDelayed(ms){
  setTimeout(function(){ cekStatus(true); }, ms);
}

function ulangiQr(){
  if(!TOK) return;
  var b = document.getElementById("aksiUlang");
  google.script.run.withSuccessHandler(function(j){
    if(j.ok && j.wa === "sent"){ perbaruiStatus({tok:TOK}, "Kartu QR dikirim ulang ke WhatsApp Anda."); }
    else if(j.ok && j.wa === "already"){ perbaruiStatus({tok:TOK}, "Kartu QR sudah dikirim sebelumnya."); }
    else { perbaruiStatus({tok:TOK}, "Pengiriman ulang gagal (" + ((j && j.wa) || "coba lagi") + ")."); }
  }).withFailureHandler(function(e){
    perbaruiStatus({tok:TOK}, "Belum bisa mengirim ulang: " + ((e&&e.message)||e));
  }).kirimQrUlang(TOK);
}

function cekStatus(senyap){
  if(!TOK) return;
  google.script.run.withSuccessHandler(function(j){
    if(j && j.ok && j.ada && j.hadir === "HADIR")
      perbaruiStatus({tok:TOK}, "<strong>Konfirmasi tercatat (HADIR, " + (j.confirm_waktu||"-") + "). Kartu QR sudah dikirim ke WhatsApp Anda — silakan cek chat WA.</strong>");
    else if(j && j.ok && j.ada)
      perbaruiStatus({tok:TOK}, "Status: " + (j.hadir||"belum konfirmasi") + " (" + (j.confirm_waktu||"-") + "). Jika HADIR, QR otomatis dikirim ke WA.");
    else if(j && j.ok && !j.ada)
      perbaruiStatus({tok:TOK}, "Data belum tercatat di server — klik 🔁 KIRIM ULANG QR KE WA atau hubungi panitia.");
    else if(j && j.error && String(j.error).indexOf("Fungsi tidak dikenal") >= 0)
      perbaruiStatus({tok:TOK}, "Backend belum diperbarui — tempel KODE-GS v7.7 ke Kode.gs lalu Deploy → New version. Data Anda tetap tersimpan.");
    else if(!senyap)
      perbaruiStatus({tok:TOK}, "Status belum dapat dibaca: " + ((j&&j.error)||"coba lagi"));
  }).withFailureHandler(function(e){
    if(!senyap) perbaruiStatus({tok:TOK}, "Server belum dapat dihubungi — coba lagi sebentar lagi.");
  }).statusKonfirmasi(TOK);
}

</script>
